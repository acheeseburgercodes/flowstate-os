services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: flowstate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: flowstate
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowstate"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
